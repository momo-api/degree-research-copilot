name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run repository tests
        shell: pwsh
        run: .\scripts\test-repository.ps1

      - name: Build release archive
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Upload test package
        uses: actions/upload-artifact@v7
        with:
          name: degree-research-copilot-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
